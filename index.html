<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Tarda Tailor — Inventory System</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:#eef2f7}
    input,select,button,textarea{font-family:inherit}
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:#f1f1f1}
    ::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}
    @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useMemo,useCallback,useEffect}=React;

let API="";
const fmt=n=>new Intl.NumberFormat("id-ID").format(n);
const fmtRp=n=>"Rp "+fmt(n);
const genId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const todayStr=()=>new Date().toISOString().split("T")[0];
const toNum=v=>parseFloat(v)||0;
const genKode=pkgs=>{const d=new Date(),dd=String(d.getDate()).padStart(2,"0"),mm=String(d.getMonth()+1).padStart(2,"0");return`PKT-${dd}${mm}${d.getFullYear()}-${String(pkgs.filter(p=>p.tanggal===todayStr()).length+1).padStart(3,"0")}`;};

const apGet=async a=>{const r=await fetch(`${API}?action=${a}`,{redirect:"follow"});const t=await r.text();let j;try{j=JSON.parse(t);}catch{throw new Error("Response bukan JSON: "+t.slice(0,80));}if(!j.success)throw new Error(j.error||"API error");return j.data;};
const apPost=async p=>{const r=await fetch(API,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(p)});const t=await r.text();let j;try{j=JSON.parse(t);}catch{throw new Error("Response bukan JSON");}if(!j.success)throw new Error(j.error||"API error");return j.data;};

const toState=d=>{
  const harga={};(d.harga_material||[]).forEach(h=>{harga[h.material_id]=toNum(h.harga);});
  const stok={};(d.stok_material||[]).forEach(s=>{stok[s.material_id]=toNum(s.qty);});
  const items=(d.paket_items||[]).map(i=>({...i,qty:toNum(i.qty),harga:toNum(i.harga)}));
  return{
    mats:d.materials||[],harga,stok,
    jenisKain:(d.jenis_kain||[]).map(j=>({id:j.id,nama:j.nama,kodePrefix:j.kode_prefix||j.kodePrefix||"",harga:toNum(j.harga)})),
    kainList:(d.stok_kain||[]).map(k=>({...k,jenisId:k.jenis_id||k.jenisId||"",jenisNama:k.jenis_nama||k.jenisNama||"",kodePrefix:k.kode_prefix||k.kodePrefix||"",meter:toNum(k.meter),sisa:toNum(k.sisa)})),
    pkgs:(d.pakets||[]).map(p=>({...p,hpp:toNum(p.hpp),items:items.filter(i=>String(i.paket_id)===String(p.id))})),
    trxs:[...(d.transaksi||[])].reverse()
  };
};

const C={pri:"#1a237e",sec:"#283593",acc:"#2196f3",ok:"#43a047",warn:"#fb8c00",err:"#e53935",bg:"#eef2f7"};
const CAT_COLORS={"Kain":"#5c6bc0","Interlining":"#00897b","Aksesoris":"#f4511e","Packaging":"#8d6e63"};
const CAT_ICONS={"Kain":"🧵","Interlining":"🪡","Aksesoris":"📎","Packaging":"📦"};

// ─── ATOMS ───────────────────────────────────────────────
const Notif=({n})=>!n?null:<div style={{position:"fixed",bottom:24,right:24,padding:"12px 20px",background:n.t==="err"?C.err:C.ok,color:"#fff",borderRadius:10,boxShadow:"0 4px 16px rgba(0,0,0,.2)",fontSize:14,zIndex:9999,maxWidth:340}}>{n.m}</div>;
const Card=({children,style})=><div style={{background:"#fff",borderRadius:12,padding:20,boxShadow:"0 2px 8px rgba(0,0,0,.07)",...style}}>{children}</div>;
const Btn=({children,onClick,bg=C.pri,style,disabled,loading})=><button onClick={onClick} disabled={disabled||loading} style={{background:(disabled||loading)?"#aaa":bg,color:"#fff",border:"none",borderRadius:8,padding:"9px 18px",cursor:(disabled||loading)?"not-allowed":"pointer",fontSize:13,fontWeight:600,...style}}>{loading?"⏳ Menyimpan...":children}</button>;
const Ghost=({children,onClick,style})=><button onClick={onClick} style={{background:"none",border:"1px solid #ddd",borderRadius:8,padding:"9px 16px",cursor:"pointer",fontSize:13,...style}}>{children}</button>;
const Inp=({label,value,onChange,type="text",placeholder,min,step,note})=>(
  <div style={{marginBottom:12}}>
    {label&&<label style={{fontSize:12,color:"#555",marginBottom:4,display:"block",fontWeight:600}}>{label}</label>}
    <input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} min={min} step={step} style={{border:"1px solid #ddd",borderRadius:8,padding:"9px 12px",fontSize:13,width:"100%",boxSizing:"border-box"}}/>
    {note&&<div style={{fontSize:11,color:"#aaa",marginTop:4}}>{note}</div>}
  </div>
);
const Sel=({label,value,onChange,options})=>(
  <div style={{marginBottom:12}}>
    {label&&<label style={{fontSize:12,color:"#555",marginBottom:4,display:"block",fontWeight:600}}>{label}</label>}
    <select value={value} onChange={e=>onChange(e.target.value)} style={{border:"1px solid #ddd",borderRadius:8,padding:"9px 12px",fontSize:13,width:"100%",boxSizing:"border-box"}}>{options.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}</select>
  </div>
);
const Badge=({label,color})=><span style={{background:color+"22",color,padding:"3px 10px",borderRadius:20,fontSize:12,fontWeight:600,whiteSpace:"nowrap"}}>{label}</span>;
function Modal({title,onClose,children,w=520}){return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,padding:16}}><div style={{background:"#fff",borderRadius:16,width:w,maxWidth:"100%",maxHeight:"90vh",overflowY:"auto"}}><div style={{padding:"16px 20px",borderBottom:"1px solid #eee",display:"flex",alignItems:"center",justifyContent:"space-between"}}><span style={{fontWeight:700,fontSize:16,color:C.pri}}>{title}</span><button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",fontSize:22,color:"#aaa",lineHeight:1}}>×</button></div><div style={{padding:20}}>{children}</div></div></div>);}
const TH=({cols})=><thead><tr>{cols.map(c=><th key={c} style={{background:"#f5f7fa",padding:"10px 12px",textAlign:"left",fontSize:12,fontWeight:700,color:"#555",borderBottom:"2px solid #e8eaf0",whiteSpace:"nowrap"}}>{c}</th>)}</tr></thead>;
const TD=({children,style})=><td style={{padding:"10px 12px",borderBottom:"1px solid #f0f2f5",fontSize:13,...style}}>{children}</td>;
const Tbl=({children})=><div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>{children}</table></div>;
function Pagination({page,total,onChange}){if(total<=1)return null;return(<div style={{display:"flex",justifyContent:"center",gap:6,marginTop:16}}>{Array.from({length:total},(_,i)=>i+1).map(p=><button key={p} onClick={()=>onChange(p)} style={{padding:"6px 12px",borderRadius:6,border:"none",cursor:"pointer",background:p===page?C.pri:"#f0f0f0",color:p===page?"#fff":"#333",fontSize:13}}>{p}</button>)}</div>);}
function StatCard({icon,label,value,color,sub}){return(<Card style={{display:"flex",alignItems:"center",gap:14}}><div style={{width:50,height:50,borderRadius:12,background:color+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>{icon}</div><div><div style={{fontSize:12,color:"#888",marginBottom:3}}>{label}</div><div style={{fontSize:18,fontWeight:700,color}}>{value}</div>{sub&&<div style={{fontSize:11,color:"#aaa",marginTop:2}}>{sub}</div>}</div></Card>);}
function Barcode({kode}){const bars=[];let x=6;for(let ci=0;ci<kode.length;ci++){const code=kode.charCodeAt(ci);for(let b=0;b<7;b++){const bit=(code>>b)&1,w=bit?2.5:1.2;bars.push(<rect key={`${ci}-${b}`} x={x} y={4} width={w} height={44} fill="#111"/>);x+=w+1.2;}x+=3;}const W=Math.min(x+12,340);return(<div style={{textAlign:"center"}}><svg width={W} height={68} viewBox={`0 0 ${x+12} 68`} style={{maxWidth:"100%",border:"1px solid #eee",borderRadius:6,padding:4,background:"#fff"}}>{bars}<text x={(x+12)/2} y={62} textAnchor="middle" fontSize={9} fontFamily="monospace" fill="#333">{kode}</text></svg><div style={{marginTop:8,fontFamily:"monospace",fontSize:14,fontWeight:700,letterSpacing:2,color:"#333"}}>{kode}</div></div>);}

// ─── LOADING ─────────────────────────────────────────────
function LoadingScreen({error,onRetry}){return(
  <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",background:`linear-gradient(135deg,${C.pri},${C.sec})`,gap:20}}>
    <div style={{fontSize:64}}>👔</div>
    <div style={{fontWeight:800,fontSize:22,color:"#fff"}}>Tarda Tailor</div>
    {!error?<>
      <div style={{display:"flex",gap:6,marginTop:8}}>{[0,1,2].map(i=><div key={i} style={{width:10,height:10,borderRadius:"50%",background:"rgba(255,255,255,.7)",animation:`bounce 1.2s ${i*0.2}s infinite`}}/>)}</div>
      <div style={{color:"rgba(255,255,255,.7)",fontSize:13}}>Memuat data dari Google Sheets...</div>
    </>:<>
      <div style={{background:"rgba(255,255,255,.15)",borderRadius:12,padding:"16px 24px",color:"#fff",fontSize:13,textAlign:"center",maxWidth:340}}>
        <div style={{fontSize:20,marginBottom:8}}>❌</div>
        <div style={{fontWeight:600,marginBottom:6}}>Gagal terhubung ke database</div>
        <div style={{opacity:.8,fontSize:12}}>{error}</div>
      </div>
      <button onClick={onRetry} style={{background:"#fff",color:C.pri,border:"none",borderRadius:8,padding:"10px 24px",fontWeight:700,cursor:"pointer",fontSize:14}}>🔄 Coba Lagi</button>
    </>}
  </div>
);}

// ─── LOGIN ───────────────────────────────────────────────
function LoginPage({onLogin}){
  const [sel,setSel]=useState(null);
  const [pw,setPw]=useState("");
  const [url,setUrl]=useState(localStorage.getItem("tarda_api_url")||"");
  const [err,setErr]=useState("");
  const PWS={owner:"052731",admin:"1234"};
  const login=()=>{
    if(!url.trim())return setErr("Masukkan URL Google Apps Script!");
    if(!url.includes("script.google.com"))return setErr("URL tidak valid. Harus dari script.google.com");
    if(!sel)return setErr("Pilih role dulu!");
    if(pw!==PWS[sel])return setErr("Password salah!");
    localStorage.setItem("tarda_api_url",url.trim());
    sessionStorage.setItem("tarda_role",sel);
    sessionStorage.setItem("tarda_api",url.trim());
    API=url.trim();
    onLogin(sel);
  };
  return(<div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:`linear-gradient(135deg,${C.pri},${C.sec})`}}>
    <div style={{background:"#fff",borderRadius:20,padding:40,width:420,maxWidth:"calc(100vw - 32px)",boxShadow:"0 20px 60px rgba(0,0,0,.3)"}}>
      <div style={{textAlign:"center",marginBottom:28}}><div style={{fontSize:52}}>👔</div><div style={{fontWeight:800,fontSize:22,color:C.pri,marginTop:8}}>Tarda Tailor</div><div style={{fontSize:13,color:"#888",marginTop:4}}>Inventory Management System</div></div>
      <div style={{marginBottom:16}}>
        <label style={{fontSize:12,color:"#555",marginBottom:6,display:"block",fontWeight:600}}>URL Google Apps Script</label>
        <input value={url} onChange={e=>{setUrl(e.target.value);setErr("");}} placeholder="https://script.google.com/macros/s/.../exec"
          style={{border:"1px solid #ddd",borderRadius:8,padding:"10px 12px",fontSize:12,width:"100%",boxSizing:"border-box",fontFamily:"monospace"}}/>
        <div style={{fontSize:11,color:"#aaa",marginTop:4}}>Apps Script → Deploy → Manage Deployments</div>
      </div>
      <div style={{fontSize:12,color:"#555",fontWeight:600,marginBottom:8}}>Login sebagai:</div>
      <div style={{display:"flex",gap:10,marginBottom:16}}>{[{id:"owner",label:"👑 Owner"},{id:"admin",label:"🏪 Admin Gudang"}].map(r=>(<button key={r.id} onClick={()=>{setSel(r.id);setErr("");}} style={{flex:1,padding:"12px 8px",borderRadius:10,border:`2px solid ${sel===r.id?C.pri:"#ddd"}`,background:sel===r.id?C.pri+"15":"#fff",color:sel===r.id?C.pri:"#555",fontWeight:700,cursor:"pointer",fontSize:13}}>{r.label}</button>))}</div>
      <div style={{marginBottom:4}}>
        <label style={{fontSize:12,color:"#555",marginBottom:6,display:"block",fontWeight:600}}>Password</label>
        <input value={pw} onChange={e=>{setPw(e.target.value);setErr("");}} type="password" placeholder="Masukkan password" onKeyDown={e=>e.key==="Enter"&&login()}
          style={{border:"1px solid #ddd",borderRadius:8,padding:"10px 12px",fontSize:13,width:"100%",boxSizing:"border-box"}}/>
      </div>
      {err&&<div style={{color:C.err,fontSize:12,margin:"8px 0"}}>❌ {err}</div>}
      <button onClick={login} style={{width:"100%",padding:13,background:C.pri,color:"#fff",border:"none",borderRadius:10,fontSize:15,fontWeight:700,cursor:"pointer",marginTop:12}}>Masuk →</button>
    </div>
  </div>);
}

// ─── PAKET DETAIL ────────────────────────────────────────
function PaketDetailModal({pkg,onClose}){if(!pkg)return null;return(<Modal title="📋 Detail Paket" onClose={onClose} w={580}><Barcode kode={pkg.kode}/><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,margin:"16px 0",fontSize:13}}><div style={{background:"#f9f9f9",borderRadius:8,padding:"10px 12px"}}><div style={{color:"#888",fontSize:11}}>NAMA PAKET</div><b>{pkg.nama}</b></div><div style={{background:"#f9f9f9",borderRadius:8,padding:"10px 12px"}}><div style={{color:"#888",fontSize:11}}>CUSTOMER</div><b>{pkg.customer||"–"}</b></div><div style={{background:"#f9f9f9",borderRadius:8,padding:"10px 12px"}}><div style={{color:"#888",fontSize:11}}>TANGGAL</div><b>{pkg.tanggal}</b></div><div style={{background:"#f9f9f9",borderRadius:8,padding:"10px 12px"}}><div style={{color:"#888",fontSize:11}}>STATUS</div><Badge label={pkg.status} color={pkg.status==="pending"?C.warn:C.ok}/></div></div>{pkg.deskripsi&&<div style={{background:"#e8eaf6",borderRadius:8,padding:"10px 12px",marginBottom:12,fontSize:13,color:C.sec}}>{pkg.deskripsi}</div>}<div style={{fontWeight:700,fontSize:13,marginBottom:8,color:C.pri}}>Detail Material:</div><Tbl><TH cols={["Material","Qty","Satuan","Harga/Satuan","Subtotal"]}/><tbody>{pkg.items.map((it,i)=>(<tr key={i}><TD><b>{it.nama}</b></TD><TD>{it.qty}</TD><TD>{it.satuan}</TD><TD>{fmtRp(it.harga)}</TD><TD><b style={{color:C.ok}}>{fmtRp(it.qty*it.harga)}</b></TD></tr>))}</tbody></Tbl><div style={{marginTop:12,padding:"14px 0",borderTop:"2px solid #eee",display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontWeight:700,fontSize:15}}>Total HPP</span><span style={{fontWeight:700,fontSize:22,color:C.ok}}>{fmtRp(pkg.hpp)}</span></div></Modal>);}

// ─── DASHBOARD ───────────────────────────────────────────
function Dashboard({mats,stok,harga,kainList,pkgs,jenisKain,onViewPaket}){
  const low=mats.filter(m=>(stok[m.id]||0)<10);
  const aktif=kainList.filter(k=>k.status==="aktif");
  const totalNilai=useMemo(()=>mats.reduce((s,m)=>s+(stok[m.id]||0)*(harga[m.id]||0),0)+aktif.reduce((s,k)=>{const jk=jenisKain.find(j=>j.id===k.jenisId);return s+(k.sisa||0)*(jk?.harga||0);},0),[mats,stok,harga,aktif,jenisKain]);
  return(<div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(190px,1fr))",gap:14,marginBottom:18}}>
      <StatCard icon="📦" label="Total Material" value={mats.length} color={C.acc}/>
      <StatCard icon="⚠️" label="Stok Menipis" value={low.length} color={C.warn} sub="< 10 unit"/>
      <StatCard icon="🧵" label="Kain Aktif" value={aktif.length} color={C.ok}/>
      <StatCard icon="📋" label="Order Pending" value={pkgs.filter(p=>p.status==="pending").length} color={C.pri}/>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:14}}>
      <Card><div style={{fontSize:13,color:"#888",marginBottom:6}}>💰 Estimasi Nilai Stok</div><div style={{fontSize:26,fontWeight:700,color:C.ok}}>{fmtRp(totalNilai)}</div><div style={{fontSize:11,color:"#bbb",marginTop:4}}>material + kain aktif · lihat detail di menu Nilai Stok</div></Card>
      <Card><div style={{fontSize:13,color:"#888",marginBottom:10}}>⚠️ Stok Menipis</div>{low.length===0?<div style={{color:C.ok,fontSize:13}}>✅ Semua stok aman</div>:low.map(m=>(<div key={m.id} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #f5f5f5",fontSize:13}}><span>{m.nama}</span><Badge label={`${stok[m.id]||0} ${m.satuan}`} color={C.err}/></div>))}</Card>
    </div>
    <Card><div style={{fontWeight:700,fontSize:14,color:C.pri,marginBottom:12}}>📋 Paket Terbaru <span style={{fontWeight:400,fontSize:12,color:"#aaa"}}>(klik untuk detail)</span></div>
      {pkgs.length===0?<div style={{color:"#aaa",fontSize:13}}>Belum ada paket</div>:<Tbl><TH cols={["Kode","Nama Paket","Customer","HPP","Status"]}/><tbody>{pkgs.slice(0,5).map(p=>(<tr key={p.id} onClick={()=>onViewPaket(p)} style={{cursor:"pointer"}} onMouseEnter={e=>e.currentTarget.style.background="#f0f4ff"} onMouseLeave={e=>e.currentTarget.style.background=""}><TD><span style={{fontFamily:"monospace",fontSize:12}}>{p.kode}</span></TD><TD><b>{p.nama}</b></TD><TD style={{fontSize:12}}>{p.customer||"–"}</TD><TD><span style={{fontWeight:700,color:C.ok}}>{fmtRp(p.hpp)}</span></TD><TD><Badge label={p.status} color={p.status==="pending"?C.warn:C.ok}/></TD></tr>))}</tbody></Tbl>}
    </Card>
  </div>);
}

// ─── NILAI STOK (MENU BARU) ──────────────────────────────
function NilaiStok({mats,stok,harga,kainList,jenisKain}){
  const [sortBy,setSortBy]=useState("nilai");
  const [sortDir,setSortDir]=useState("desc");
  const [filterKat,setFilterKat]=useState("Semua");

  const kainAktif=kainList.filter(k=>k.status==="aktif");
  const kainItems=kainAktif.map(k=>{
    const jk=jenisKain.find(j=>j.id===k.jenisId);
    const h=jk?.harga||0;
    return{id:k.id,nama:`${k.jenisNama} ${k.kode}`,kategori:"Kain",qty:k.sisa,satuan:"meter",harga:h,nilai:k.sisa*h,customer:k.customer||""};
  });
  const matItems=mats.map(m=>({id:m.id,nama:m.nama,kategori:m.kategori||"Material",qty:stok[m.id]||0,satuan:m.satuan,harga:harga[m.id]||0,nilai:(stok[m.id]||0)*(harga[m.id]||0)}));
  const allItems=[...kainItems,...matItems];
  const totalAll=allItems.reduce((s,i)=>s+i.nilai,0);

  const categories=useMemo(()=>["Semua","Kain",...new Set(mats.map(m=>m.kategori).filter(Boolean))]  ,[mats]);

  const filtered=useMemo(()=>{
    let l=filterKat==="Semua"?allItems:allItems.filter(i=>i.kategori===filterKat);
    return[...l].sort((a,b)=>{
      const cmp=sortBy==="nilai"?b.nilai-a.nilai:a.nama.localeCompare(b.nama);
      return sortDir==="asc"?-cmp:cmp;
    });
  },[allItems,filterKat,sortBy,sortDir]);

  const totalFiltered=filtered.reduce((s,i)=>s+i.nilai,0);

  const catTotals=useMemo(()=>{
    const c={};
    allItems.forEach(i=>{if(!c[i.kategori])c[i.kategori]=0;c[i.kategori]+=i.nilai;});
    return c;
  },[allItems]);

  return(<div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(170px,1fr))",gap:14,marginBottom:18}}>
      <StatCard icon="💰" label="Total Nilai Stok" value={fmtRp(totalAll)} color={C.ok}/>
      {Object.entries(catTotals).map(([cat,val])=>(
        <StatCard key={cat} icon={CAT_ICONS[cat]||"📦"} label={cat} value={fmtRp(val)} color={CAT_COLORS[cat]||C.acc}/>
      ))}
    </div>
    <Card>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {categories.map(cat=>(<button key={cat} onClick={()=>setFilterKat(cat)} style={{padding:"5px 14px",borderRadius:20,border:"none",cursor:"pointer",fontSize:12,fontWeight:600,background:filterKat===cat?C.pri:"#f0f0f0",color:filterKat===cat?"#fff":"#555"}}>{cat}</button>))}
        </div>
        <div style={{display:"flex",gap:8}}>
          <select value={sortBy} onChange={e=>setSortBy(e.target.value)} style={{border:"1px solid #ddd",borderRadius:8,padding:"7px 10px",fontSize:13}}>
            <option value="nilai">Sort: Nilai</option>
            <option value="nama">Sort: Nama</option>
          </select>
          <button onClick={()=>setSortDir(d=>d==="asc"?"desc":"asc")} style={{border:"1px solid #ddd",borderRadius:8,padding:"7px 10px",fontSize:13,cursor:"pointer",background:"#fff",minWidth:110}}>
            {sortDir==="desc"?"↓ Tertinggi":"↑ Terendah"}
          </button>
        </div>
      </div>
      <Tbl><TH cols={["Nama Item","Kategori","Qty","Harga/Satuan","Nilai"]}/><tbody>
        {filtered.map(i=>(<tr key={i.id}>
          <TD><b>{i.nama}</b>{i.customer&&<span style={{fontSize:11,color:"#aaa",marginLeft:6}}>({i.customer})</span>}</TD>

// ─── MASTER MATERIAL ─────────────────────────────────────
function MasterMaterial({mats,setMats,harga,showNotif,role}){
  const canEdit=role==="owner";const [search,setSearch]=useState("");const [modal,setModal]=useState(false);const [edit,setEdit]=useState(null);const [f,setF]=useState({kode:"",nama:"",satuan:"",kategori:""});const [saving,setSaving]=useState(false);const [pg,setPg]=useState(1);const PS=10;
  const list=useMemo(()=>mats.filter(m=>m.nama.toLowerCase().includes(search.toLowerCase())||m.kode.toLowerCase().includes(search.toLowerCase())),[mats,search]);
  const paged=list.slice((pg-1)*PS,pg*PS);
  const open=(m=null)=>{setEdit(m);setF(m?{kode:m.kode,nama:m.nama,satuan:m.satuan,kategori:m.kategori}:{kode:"",nama:"",satuan:"",kategori:""});setModal(true);};
  const save=async()=>{if(!f.kode||!f.nama||!f.satuan)return showNotif("Lengkapi field wajib!","err");if(!edit&&mats.find(m=>m.kode===f.kode))return showNotif("Kode sudah ada!","err");const payload=edit?{...edit,...f}:{id:genId(),...f};setSaving(true);try{await apPost({action:"saveMaterial",payload});edit?setMats(p=>p.map(m=>m.id===edit.id?payload:m)):setMats(p=>[...p,payload]);showNotif(edit?"Diupdate!":"Ditambah!");setModal(false);}catch(e){showNotif("Gagal: "+e.message,"err");}setSaving(false);};
  const del=async m=>{if(!confirm(`Hapus ${m.nama}?`))return;try{await apPost({action:"deleteMaterial",id:m.id});setMats(p=>p.filter(x=>x.id!==m.id));showNotif("Dihapus!");}catch(e){showNotif("Gagal: "+e.message,"err");}};
  return(<div>
    {!canEdit&&<div style={{background:"#fff8e1",borderRadius:8,padding:"10px 14px",marginBottom:14,fontSize:13,color:"#e65100"}}>⚠️ Mode baca saja</div>}
    <Card>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:8}}>
        <input placeholder="🔍 Cari material..." value={search} onChange={e=>{setSearch(e.target.value);setPg(1);}} style={{border:"1px solid #ddd",borderRadius:8,padding:"9px 12px",fontSize:13,width:240}}/>
        {canEdit&&<Btn onClick={()=>open()}>+ Tambah Material</Btn>}
      </div>
      <Tbl><TH cols={["Kode","Nama","Satuan","Kategori","Harga",canEdit?"Aksi":""]}/><tbody>{paged.map(m=>(<tr key={m.id}><TD><span style={{fontFamily:"monospace",fontSize:12}}>{m.kode}</span></TD><TD><b>{m.nama}</b></TD><TD>{m.satuan}</TD><TD><Badge label={m.kategori} color={CAT_COLORS[m.kategori]||C.acc}/></TD><TD>{harga[m.id]?<span style={{fontWeight:600,color:C.ok}}>{fmtRp(harga[m.id])}/{m.satuan}</span>:<span style={{color:"#bbb"}}>–</span>}</TD><TD>{canEdit&&<div style={{display:"flex",gap:6}}><Ghost onClick={()=>open(m)} style={{padding:"5px 10px",fontSize:12}}>✏️</Ghost><Ghost onClick={()=>del(m)} style={{padding:"5px 10px",fontSize:12,color:C.err}}>🗑️</Ghost></div>}</TD></tr>))}</tbody></Tbl>
      <Pagination page={pg} total={Math.ceil(list.length/PS)} onChange={setPg}/>
    </Card>
    {modal&&canEdit&&<Modal title={edit?"Edit Material":"Tambah Material"} onClose={()=>setModal(false)}><Inp label="Kode *" value={f.kode} onChange={v=>setF(x=>({...x,kode:v}))} placeholder="RSL-002"/><Inp label="Nama *" value={f.nama} onChange={v=>setF(x=>({...x,nama:v}))} placeholder="Resletting"/><Inp label="Satuan *" value={f.satuan} onChange={v=>setF(x=>({...x,satuan:v}))} placeholder="pcs/meter/cone"/><Inp label="Kategori" value={f.kategori} onChange={v=>setF(x=>({...x,kategori:v}))} placeholder="Aksesoris"/><div style={{display:"flex",gap:8,justifyContent:"flex-end"}}><Ghost onClick={()=>setModal(false)}>Batal</Ghost><Btn onClick={save} loading={saving}>Simpan</Btn></div></Modal>}
  </div>);
}

    {tab==="kain"&&<Card>

        <div><div style={{fontWeight:700,fontSize:14,color:C.pri}}>Jenis Kain & Harga/Meter</div><div style={{fontSize:12,color:"#aaa",marginTop:2}}>Berlaku semua warna dalam 1 jenis kain</div></div>
        <div style={{display:"flex",gap:8}}><input placeholder="🔍 Cari..." value={search} onChange={e=>setSearch(e.target.value)} style={{border:"1px solid #ddd",borderRadius:8,padding:"9px 12px",fontSize:13,width:180}}/>{canEdit&&<Btn onClick={()=>{setJkEdit(null);setJkF({nama:"",kodePrefix:"",harga:""});setJkModal(true);}}>+ Tambah</Btn>}</div>

// ─── STOK KAIN ───────────────────────────────────────────
function StokKain({kainList,setKainList,jenisKain,showNotif,addTrx}){
  const [search,setSearch]=useState("");const [cust,setCust]=useState("");const [modal,setModal]=useState(false);
  const [f,setF]=useState({jenisId:"",warna:"",tipe:"roll",meter:"",customer:"",tanggal:todayStr()});
  const [saving,setSaving]=useState(false);const [pg,setPg]=useState(1);const PS=10;
  const aktif=kainList.filter(k=>k.status==="aktif");
  const custs=[...new Set(aktif.filter(k=>k.customer).map(k=>k.customer))];
  const selJenis=jenisKain.find(j=>j.id===f.jenisId);
  const kodePreview=selJenis&&f.warna?`${selJenis.kodePrefix}-${f.warna.toUpperCase()}`:(selJenis?`${selJenis.kodePrefix}-...`:"–");
  const list=useMemo(()=>{let l=aktif;if(search)l=l.filter(k=>k.kode.toLowerCase().includes(search.toLowerCase())||k.jenisNama.toLowerCase().includes(search.toLowerCase())||k.customer.toLowerCase().includes(search.toLowerCase()));if(cust)l=l.filter(k=>k.customer===cust);return l;},[aktif,search,cust]);
  const paged=list.slice((pg-1)*PS,pg*PS);

  const save=async()=>{
    if(!f.jenisId||!f.warna||!f.meter)return showNotif("Lengkapi semua field!","err");
    // Customer hanya wajib untuk kain potongan
    if(f.tipe==="potongan"&&!f.customer)return showNotif("Nama customer wajib untuk kain potongan!","err");
    const jk=jenisKain.find(j=>j.id===f.jenisId);
    const kode=`${jk.kodePrefix}-${f.warna.trim().toUpperCase()}`;
    if(kainList.find(k=>k.kode===kode&&k.status==="aktif"))return showNotif(`Kode ${kode} sudah aktif!`,"err");
    const id=genId();
    const stateEntry={id,kode,jenisId:f.jenisId,jenisNama:jk.nama,kodePrefix:jk.kodePrefix,warna:f.warna.trim().toUpperCase(),tipe:f.tipe,meter:parseFloat(f.meter),sisa:parseFloat(f.meter),customer:f.customer,tanggal:f.tanggal,status:"aktif"};
    const apiEntry={id,kode,jenis_id:f.jenisId,jenis_nama:jk.nama,kode_prefix:jk.kodePrefix,warna:stateEntry.warna,tipe:f.tipe,meter:stateEntry.meter,sisa:stateEntry.sisa,customer:f.customer,tanggal:f.tanggal,status:"aktif"};
    const trx={id:genId(),type:"inbound",detail:`Kain masuk: ${jk.nama} ${kode}${f.customer?" — "+f.customer:""}`,tanggal:new Date().toISOString()};
    setSaving(true);
    try{await apPost({action:"saveStokKain",payload:apiEntry});await apPost({action:"saveTransaksi",payload:trx});setKainList(p=>[...p,stateEntry]);addTrx("inbound",trx.detail);showNotif(`Kain ${kode} berhasil ditambah!`);setModal(false);}
    catch(e){showNotif("Gagal: "+e.message,"err");}
    setSaving(false);
  };

  const arsip=async k=>{if(!confirm(`Arsipkan ${k.kode}?`))return;try{await apPost({action:"updateStokKain",id:k.id,fields:{status:"arsip"}});setKainList(p=>p.map(x=>x.id===k.id?{...x,status:"arsip"}:x));showNotif("Diarsipkan!");}catch(e){showNotif("Gagal: "+e.message,"err");}};

  return(<div>
    <Card>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <input placeholder="🔍 Cari kode / jenis / customer..." value={search} onChange={e=>{setSearch(e.target.value);setPg(1);}} style={{border:"1px solid #ddd",borderRadius:8,padding:"9px 12px",fontSize:13,width:260}}/>
          <select value={cust} onChange={e=>{setCust(e.target.value);setPg(1);}} style={{border:"1px solid #ddd",borderRadius:8,padding:"9px 12px",fontSize:13}}>
            <option value="">Semua Customer</option>{custs.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
        </div>
        <Btn onClick={()=>{setF({jenisId:jenisKain[0]?.id||"",warna:"",tipe:"roll",meter:"",customer:"",tanggal:todayStr()});setModal(true);}}>+ Tambah Kain</Btn>
      </div>
      <Tbl><TH cols={["Kode Lengkap","Jenis Kain","Warna","Tipe","Total","Sisa","Customer","Tgl","Aksi"]}/><tbody>
        {paged.map(k=>(<tr key={k.id}><TD><div style={{fontFamily:"monospace",fontSize:12,fontWeight:700,color:C.pri}}>{k.kode}</div></TD><TD>{k.jenisNama}</TD><TD><Badge label={k.warna||"–"} color="#5c6bc0"/></TD><TD><Badge label={k.tipe} color={k.tipe==="roll"?C.acc:C.warn}/></TD><TD>{k.meter} m</TD><TD><span style={{fontWeight:700,color:k.sisa<1?C.err:C.ok}}>{k.sisa} m</span></TD><TD>{k.customer||<span style={{color:"#ccc"}}>–</span>}</TD><TD style={{fontSize:12}}>{k.tanggal}</TD><TD><Ghost onClick={()=>arsip(k)} style={{padding:"5px 10px",fontSize:12,color:C.warn}}>🗃️</Ghost></TD></tr>))}
      </tbody></Tbl>
      <Pagination page={pg} total={Math.ceil(list.length/PS)} onChange={setPg}/>
    </Card>

    {modal&&<Modal title="Tambah Kain Masuk" onClose={()=>setModal(false)}>
      <Sel label="Jenis Kain *" value={f.jenisId} onChange={v=>setF(x=>({...x,jenisId:v}))} options={jenisKain.map(j=>({v:j.id,l:`${j.nama}  [${j.kodePrefix}]  —  ${fmtRp(j.harga)}/m`}))}/>
      <Inp label="Kode Warna *" value={f.warna} onChange={v=>setF(x=>({...x,warna:v.toUpperCase()}))} placeholder="024 / NAVY / RED" note="Otomatis huruf kapital"/>
      <div style={{background:"#f0f4ff",borderRadius:8,padding:"10px 14px",marginBottom:14,display:"flex",alignItems:"center",gap:10}}><div style={{fontSize:12,color:"#555"}}>Kode lengkap:</div><div style={{fontFamily:"monospace",fontSize:16,fontWeight:700,color:C.pri}}>{kodePreview}</div></div>
      <div style={{marginBottom:12}}>
        <label style={{fontSize:12,color:"#555",marginBottom:6,display:"block",fontWeight:600}}>Tipe *</label>
        <div style={{display:"flex",gap:8}}>
          {["roll","potongan"].map(t=>(<button key={t} onClick={()=>setF(x=>({...x,tipe:t,customer:""}))} style={{flex:1,padding:10,borderRadius:8,border:`2px solid ${f.tipe===t?C.pri:"#ddd"}`,background:f.tipe===t?C.pri+"15":"#fff",color:f.tipe===t?C.pri:"#333",fontWeight:600,cursor:"pointer",fontSize:13}}>{t==="roll"?"🎞️ Roll":"✂️ Potongan"}</button>))}
        </div>
      </div>
      <Inp label="Total Meter *" type="number" value={f.meter} onChange={v=>setF(x=>({...x,meter:v}))} placeholder="25" min="0.1" step="0.1"/>

      {/* Customer hanya untuk potongan */}
      {f.tipe==="potongan"&&(
        <Inp label="Nama Customer *" value={f.customer} onChange={v=>setF(x=>({...x,customer:v}))} placeholder="Ibu Sari"/>
      )}
      {f.tipe==="roll"&&(
        <div style={{background:"#e8f5e9",borderRadius:8,padding:"10px 14px",marginBottom:12,fontSize:12,color:C.ok}}>
          ℹ️ Kain roll tidak memerlukan nama customer
        </div>
      )}

      <Inp label="Tanggal Masuk" type="date" value={f.tanggal} onChange={v=>setF(x=>({...x,tanggal:v}))}/>
      {selJenis&&<div style={{background:"#f9fbe7",borderRadius:8,padding:"10px 14px",marginBottom:12,fontSize:13}}>💰 {fmtRp(selJenis.harga)}/meter{f.meter&&<span style={{color:"#888"}}> — Total: <b>{fmtRp(selJenis.harga*parseFloat(f.meter||0))}</b></span>}</div>}
      <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}><Ghost onClick={()=>setModal(false)}>Batal</Ghost><Btn onClick={save} loading={saving}>Simpan</Btn></div>
    </Modal>}
  </div>);
}

// ─── BUAT PAKET ──────────────────────────────────────────
function BuatPaket({mats,kainList,stok,harga,jenisKain,pkgs,setPkgs,showNotif}){
  const aktifKain=kainList.filter(k=>k.status==="aktif");const [nama,setNama]=useState("");const [customer,setCustomer]=useState("");const [deskripsi,setDeskripsi]=useState("");const [search,setSearch]=useState("");const [catFilter,setCatFilter]=useState("Semua");const [selected,setSelected]=useState({});const [saving,setSaving]=useState(false);
  const allPickable=useMemo(()=>[...mats.map(m=>({id:m.id,type:"material",nama:m.nama,satuan:m.satuan,kategori:m.kategori,stok:stok[m.id]||0,harga:harga[m.id]||0})),...aktifKain.map(k=>{const jk=jenisKain.find(j=>j.id===k.jenisId);return{id:k.id,type:"kain",nama:`${k.jenisNama} ${k.kode}`,satuan:"meter",kategori:"Kain",stok:k.sisa,harga:jk?.harga||0};})]  ,[mats,aktifKain,stok,harga,jenisKain]);
  const categories=useMemo(()=>["Semua","Kain",...new Set(mats.map(m=>m.kategori))]  ,[mats]);
  const filtered=useMemo(()=>{let l=allPickable;if(search)l=l.filter(i=>i.nama.toLowerCase().includes(search.toLowerCase()));if(catFilter!=="Semua")l=l.filter(i=>i.kategori===catFilter);return l;},[allPickable,search,catFilter]);
  const toggle=useCallback(item=>{setSelected(p=>{if(p[item.id]!==undefined){const{[item.id]:_,...r}=p;return r;}return{...p,[item.id]:1};});},[]);
  const updQty=(id,v)=>{const n=parseFloat(v);if(n>0)setSelected(p=>({...p,[id]:n}));};
  const selItems=useMemo(()=>allPickable.filter(i=>selected[i.id]!==undefined),[allPickable,selected]);
  const hpp=useMemo(()=>selItems.reduce((s,i)=>s+(selected[i.id]||0)*i.harga,0),[selItems,selected]);
  const save=async()=>{if(!nama)return showNotif("Isi nama paket!","err");if(selItems.length===0)return showNotif("Pilih minimal 1 material!","err");const kode=genKode(pkgs);const paket={id:genId(),kode,nama,customer,deskripsi,hpp,tanggal:todayStr(),status:"pending"};const items=selItems.map(i=>({id:genId(),paket_id:paket.id,type:i.type,ref_id:i.id,nama:i.nama,qty:selected[i.id],satuan:i.satuan,harga:i.harga}));setSaving(true);try{await apPost({action:"savePaket",paket,items});setPkgs(p=>[{...paket,items},...p]);showNotif(`✅ Paket ${kode} berhasil disimpan!`);setNama("");setCustomer("");setDeskripsi("");setSelected({});}catch(e){showNotif("Gagal: "+e.message,"err");}setSaving(false);};
  return(<div style={{maxWidth:720,margin:"0 auto"}}>
    <Card style={{marginBottom:14}}><div style={{fontWeight:700,fontSize:15,color:C.pri,marginBottom:16}}>✏️ Buat Template Paket Baru</div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}><Inp label="Nama Paket / Model Baju *" value={nama} onChange={setNama} placeholder="Gamis Bagus Sulaiman"/><Inp label="Nama Customer" value={customer} onChange={setCustomer} placeholder="Ibu Sari"/></div><Inp label="Deskripsi (opsional)" value={deskripsi} onChange={setDeskripsi} placeholder="cth: gamis lengan panjang warna hitam"/></Card>
    <Card style={{marginBottom:14}}><div style={{fontWeight:700,fontSize:15,color:C.pri,marginBottom:12}}>📦 Pilih Material</div><input placeholder="🔍 Cari material..." value={search} onChange={e=>setSearch(e.target.value)} style={{border:"1px solid #ddd",borderRadius:8,padding:"9px 12px",fontSize:13,width:"100%",boxSizing:"border-box",marginBottom:10}}/><div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>{categories.map(cat=>(<button key={cat} onClick={()=>setCatFilter(cat)} style={{padding:"5px 14px",borderRadius:20,border:"none",cursor:"pointer",fontSize:12,fontWeight:600,background:catFilter===cat?C.pri:"#f0f0f0",color:catFilter===cat?"#fff":"#555"}}>{cat}</button>))}</div><div style={{maxHeight:300,overflowY:"auto",border:"1px solid #eee",borderRadius:8}}>{filtered.map(item=>{const isSel=selected[item.id]!==undefined;return(<div key={item.id} onClick={()=>toggle(item)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"11px 16px",cursor:"pointer",background:isSel?"#e8f5e9":"#fff",borderBottom:"1px solid #f5f5f5"}} onMouseEnter={e=>{if(!isSel)e.currentTarget.style.background="#f9f9f9";}} onMouseLeave={e=>{e.currentTarget.style.background=isSel?"#e8f5e9":"#fff";}}><div><div style={{fontWeight:600,fontSize:14}}>{item.nama}</div><div style={{fontSize:12,color:"#888",marginTop:2}}>{item.kategori} · Stok: {item.stok} {item.satuan} · {fmtRp(item.harga)}/{item.satuan}</div></div><div style={{color:isSel?C.ok:"#ddd",fontSize:24,fontWeight:700,width:32,textAlign:"center"}}>{isSel?"✓":"○"}</div></div>);})}</div></Card>
    {selItems.length>0&&<Card><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}><div style={{fontWeight:700,fontSize:15,color:C.pri}}>MATERIAL DIPILIH & JUMLAH <span style={{fontWeight:400,fontSize:12,color:"#aaa"}}>({selItems.length} item)</span></div><Ghost onClick={()=>setSelected({})} style={{padding:"6px 12px",fontSize:12,color:C.err}}>🗑️ Bersihkan</Ghost></div>{selItems.map(item=>(<div key={item.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 0",borderBottom:"1px solid #f5f5f5"}}><div style={{flex:1,minWidth:0}}><div style={{fontWeight:600,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.nama}</div><div style={{fontSize:11,color:C.ok,marginTop:2}}>{fmtRp(item.harga)}/{item.satuan} = <b>{fmtRp((selected[item.id]||0)*item.harga)}</b></div></div><input type="number" value={selected[item.id]||""} onChange={e=>updQty(item.id,e.target.value)} min="0.1" step="0.1" style={{width:72,border:"1px solid #ddd",borderRadius:6,padding:"7px 8px",fontSize:14,textAlign:"center"}}/><span style={{fontSize:12,color:"#888",width:40,flexShrink:0}}>{item.satuan}</span><button onClick={()=>toggle(item)} style={{background:"none",border:"none",cursor:"pointer",color:C.err,fontSize:22,lineHeight:1,padding:0}}>×</button></div>))}<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 0",borderTop:"2px solid #eee",marginTop:8}}><span style={{fontWeight:700,fontSize:15}}>Total HPP</span><span style={{fontWeight:800,fontSize:22,color:C.ok}}>{fmtRp(hpp)}</span></div><Btn onClick={save} loading={saving} style={{width:"100%",padding:"13px",fontSize:15}}>💾 Simpan Paket</Btn></Card>}
  </div>);
}

// ─── DAFTAR PAKET ────────────────────────────────────────
function DaftarPaket({pkgs,setPkgs,onViewPaket,showNotif,role}){
  const canEdit=role==="owner";const [search,setSearch]=useState("");const [statusF,setStatusF]=useState("all");const [pg,setPg]=useState(1);const PS=10;
  const list=useMemo(()=>{let l=pkgs;if(search)l=l.filter(p=>p.nama.toLowerCase().includes(search.toLowerCase())||p.kode.toLowerCase().includes(search.toLowerCase())||(p.customer||"").toLowerCase().includes(search.toLowerCase()));if(statusF!=="all")l=l.filter(p=>p.status===statusF);return l;},[pkgs,search,statusF]);
  const paged=list.slice((pg-1)*PS,pg*PS);
  const hapus=async p=>{if(!confirm(`Hapus paket ${p.nama}?`))return;try{await apPost({action:"deletePaket",id:p.id});setPkgs(prev=>prev.filter(x=>x.id!==p.id));showNotif("Paket dihapus!");}catch(e){showNotif("Gagal: "+e.message,"err");}};
  const ubahStatus=async(p,s)=>{try{await apPost({action:"updatePaketStatus",id:p.id,status:s});setPkgs(prev=>prev.map(x=>x.id===p.id?{...x,status:s}:x));showNotif("Status diupdate!");}catch(e){showNotif("Gagal: "+e.message,"err");}};
  return(<div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:14,marginBottom:18}}><StatCard icon="📋" label="Total Paket" value={pkgs.length} color={C.pri}/><StatCard icon="⏳" label="Pending" value={pkgs.filter(p=>p.status==="pending").length} color={C.warn}/><StatCard icon="✅" label="Selesai" value={pkgs.filter(p=>p.status==="selesai").length} color={C.ok}/></div>
    <Card>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:8}}><input placeholder="🔍 Cari nama / kode / customer..." value={search} onChange={e=>{setSearch(e.target.value);setPg(1);}} style={{border:"1px solid #ddd",borderRadius:8,padding:"9px 12px",fontSize:13,width:300}}/><select value={statusF} onChange={e=>{setStatusF(e.target.value);setPg(1);}} style={{border:"1px solid #ddd",borderRadius:8,padding:"9px 12px",fontSize:13}}><option value="all">Semua Status</option><option value="pending">⏳ Pending</option><option value="selesai">✅ Selesai</option></select></div>
      {paged.length===0?<div style={{textAlign:"center",padding:50,color:"#ccc"}}><div style={{fontSize:48}}>📋</div><div style={{marginTop:10}}>Tidak ada paket</div></div>:
        <><Tbl><TH cols={["Kode","Nama Paket","Customer","HPP","Tanggal","Status","Aksi"]}/><tbody>{paged.map(p=>(<tr key={p.id}><TD><span style={{fontFamily:"monospace",fontSize:12,color:C.pri,fontWeight:700}}>{p.kode}</span></TD><TD><div style={{fontWeight:600}}>{p.nama}</div>{p.deskripsi&&<div style={{fontSize:11,color:"#aaa",marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:180}}>{p.deskripsi}</div>}</TD><TD>{p.customer||<span style={{color:"#ccc"}}>–</span>}</TD><TD><span style={{fontWeight:700,color:C.ok}}>{fmtRp(p.hpp)}</span></TD><TD style={{fontSize:12,whiteSpace:"nowrap"}}>{p.tanggal}</TD><TD><select value={p.status} onChange={e=>ubahStatus(p,e.target.value)} style={{border:"1px solid #ddd",borderRadius:6,padding:"4px 8px",fontSize:12,cursor:"pointer",background:p.status==="pending"?C.warn+"22":C.ok+"22",color:p.status==="pending"?C.warn:C.ok,fontWeight:600}}><option value="pending">⏳ Pending</option><option value="selesai">✅ Selesai</option></select></TD><TD><div style={{display:"flex",gap:6}}><Ghost onClick={()=>onViewPaket(p)} style={{padding:"5px 10px",fontSize:12}}>👁️</Ghost>{canEdit&&<Ghost onClick={()=>hapus(p)} style={{padding:"5px 10px",fontSize:12,color:C.err}}>🗑️</Ghost>}</div></TD></tr>))}</tbody></Tbl><Pagination page={pg} total={Math.ceil(list.length/PS)} onChange={setPg}/></>}
    </Card>
  </div>);
}

// ─── MENU ORDER ──────────────────────────────────────────
function MenuOrder({pkgs,setPkgs,stok,setStok,kainList,setKainList,addTrx,showNotif}){
  const [input,setInput]=useState("");const [found,setFound]=useState(null);const [notFound,setNotFound]=useState(false);const [saving,setSaving]=useState(false);
  const doSearch=()=>{const p=pkgs.find(x=>x.kode===input.trim());if(p){setFound(p);setNotFound(false);}else{setFound(null);setNotFound(true);}};
  const process=async()=>{setSaving(true);try{await apPost({action:"processOrder",paketId:found.id,items:found.items});const detail=`Order keluar: ${found.nama} (${found.kode})`;await apPost({action:"saveTransaksi",payload:{id:genId(),type:"outbound",detail,tanggal:new Date().toISOString()}});const ns={...stok};found.items.filter(i=>i.type==="material").forEach(i=>{ns[i.ref_id||i.refId]=(ns[i.ref_id||i.refId]||0)-i.qty;});setStok(ns);setKainList(p=>p.map(k=>{const ki=found.items.find(i=>i.type==="kain"&&(i.ref_id||i.refId)===k.id);if(!ki)return k;const s=+(k.sisa-ki.qty).toFixed(3);return{...k,sisa:Math.max(0,s),status:s<=0?"arsip":k.status};}));setPkgs(p=>p.map(x=>x.id===found.id?{...x,status:"selesai"}:x));addTrx("outbound",detail);showNotif(`✅ Order ${found.kode} berhasil!`);setFound(null);setInput("");}catch(e){showNotif("Gagal: "+e.message,"err");}setSaving(false);};
  return(<div style={{maxWidth:600,margin:"0 auto"}}>
    <Card><div style={{textAlign:"center",fontWeight:700,fontSize:16,color:C.pri,marginBottom:20}}>🔍 Scan / Input Kode Paket</div>
      <div style={{display:"flex",gap:8}}><input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doSearch()} placeholder="Scan barcode atau ketik kode paket..." autoFocus style={{flex:1,border:"2px solid #ddd",borderRadius:10,padding:"12px 16px",fontSize:15,outline:"none",boxSizing:"border-box"}}/><Btn onClick={doSearch} style={{padding:"12px 20px",fontSize:14}}>Cari</Btn></div>
      {notFound&&<div style={{marginTop:14,padding:12,background:"#fff3f3",borderRadius:8,color:C.err,fontSize:13,textAlign:"center"}}>❌ Kode paket tidak ditemukan</div>}
    </Card>
    {found&&<Card style={{marginTop:14}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}><div style={{fontWeight:700,fontSize:15,color:C.pri}}>📋 Detail Paket</div><Badge label={found.status} color={found.status==="pending"?C.warn:C.ok}/></div><div style={{background:"#f9f9f9",borderRadius:8,padding:12,marginBottom:14}}><div style={{fontWeight:700,fontSize:15}}>{found.nama}</div>{found.customer&&<div style={{fontSize:12,color:"#888",marginTop:2}}>👤 {found.customer}</div>}<div style={{fontFamily:"monospace",fontSize:12,color:"#aaa",marginTop:4}}>{found.kode}</div></div>{found.items.map((it,i)=>(<div key={i} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid #f5f5f5",fontSize:13}}><span>{it.nama}</span><span style={{fontWeight:600}}>{it.qty} {it.satuan}</span></div>))}<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 0",borderTop:"2px solid #eee",marginTop:6}}><span style={{fontWeight:700}}>Total HPP</span><span style={{fontWeight:700,fontSize:18,color:C.ok}}>{fmtRp(found.hpp)}</span></div>{found.status==="selesai"?<div style={{marginTop:10,padding:12,background:"#e8f5e9",borderRadius:8,color:C.ok,textAlign:"center",fontSize:13}}>✅ Paket ini sudah diproses</div>:<Btn onClick={process} loading={saving} style={{width:"100%",marginTop:14,background:C.ok,padding:"13px",fontSize:15}}>✅ Konfirmasi & Keluarkan Stok</Btn>}</Card>}
  </div>);
}

// ─── INBOUND / OUTBOUND ──────────────────────────────────
function InboundOutbound({mats,stok,setStok,addTrx,showNotif}){
  const [tab,setTab]=useState("inbound");const [f,setF]=useState({mid:mats[0]?.id||"",qty:"",tanggal:todayStr(),ket:""});const [saving,setSaving]=useState(false);
  const mat=mats.find(m=>m.id===f.mid);
  const save=async()=>{if(!f.qty||parseFloat(f.qty)<=0)return showNotif("Masukkan jumlah!","err");const q=parseFloat(f.qty);if(tab==="outbound"&&(stok[f.mid]||0)<q)return showNotif(`Stok tidak cukup! (${stok[f.mid]||0} ${mat?.satuan})`,"err");const newQty=(stok[f.mid]||0)+(tab==="inbound"?q:-q);const detail=`${mat?.nama} ${tab==="inbound"?"masuk":"keluar"}: ${q} ${mat?.satuan}${f.ket?" — "+f.ket:""}`;setSaving(true);try{await apPost({action:"updateStok",payload:{material_id:f.mid,qty:newQty}});await apPost({action:"saveTransaksi",payload:{id:genId(),type:tab,detail,tanggal:new Date().toISOString()}});setStok(p=>({...p,[f.mid]:newQty}));addTrx(tab,detail);showNotif(`✅ ${mat?.nama} ${tab==="inbound"?"+":"-"}${q} ${mat?.satuan}`);setF(x=>({...x,qty:"",ket:""}));}catch(e){showNotif("Gagal: "+e.message,"err");}setSaving(false);};
  return(<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
    <Card>
      <div style={{display:"flex",gap:8,marginBottom:18}}>{[["inbound","📥 Inbound",C.ok],["outbound","📤 Outbound Manual",C.err]].map(([id,label,color])=>(<button key={id} onClick={()=>setTab(id)} style={{flex:1,padding:"10px 8px",borderRadius:8,border:`2px solid ${tab===id?color:"#ddd"}`,background:tab===id?color+"15":"#fff",color:tab===id?color:"#555",fontWeight:700,cursor:"pointer",fontSize:13}}>{label}</button>))}</div>
      <div style={{background:tab==="inbound"?"#e8f5e9":"#fff3f3",borderRadius:8,padding:"10px 14px",marginBottom:14,fontSize:12,color:tab==="inbound"?C.ok:C.err}}>{tab==="inbound"?"📥 Menambah stok material":"📤 Mengurangi stok (koreksi/rusak/retur)"}{tab==="outbound"&&<div style={{fontSize:11,color:"#888",marginTop:4}}>Untuk outbound via order → gunakan Menu Order</div>}</div>
      <div style={{marginBottom:12}}><label style={{fontSize:12,color:"#555",marginBottom:4,display:"block",fontWeight:600}}>Material *</label><select value={f.mid} onChange={e=>setF(x=>({...x,mid:e.target.value}))} style={{border:"1px solid #ddd",borderRadius:8,padding:"9px 12px",fontSize:13,width:"100%",boxSizing:"border-box"}}>{mats.map(m=><option key={m.id} value={m.id}>{m.nama} ({m.kode})</option>)}</select></div>
      {tab==="outbound"&&mat&&<div style={{background:"#f9f9f9",borderRadius:8,padding:"8px 12px",marginBottom:12,fontSize:13}}>Stok saat ini: <b style={{color:(stok[f.mid]||0)<10?C.err:C.ok}}>{stok[f.mid]||0} {mat.satuan}</b></div>}
      <Inp label="Jumlah *" type="number" value={f.qty} onChange={v=>setF(x=>({...x,qty:v}))} placeholder="100" min="0"/>
      <Inp label="Tanggal" type="date" value={f.tanggal} onChange={v=>setF(x=>({...x,tanggal:v}))}/>
      <Inp label="Keterangan" value={f.ket} onChange={v=>setF(x=>({...x,ket:v}))} placeholder={tab==="inbound"?"Pembelian dari Supplier X":"Koreksi/rusak/retur"}/>
      <Btn onClick={save} loading={saving} bg={tab==="inbound"?C.ok:C.err} style={{width:"100%"}}>{tab==="inbound"?"✅ Simpan Inbound":"✅ Simpan Outbound"}</Btn>
    </Card>
    <Card><div style={{fontWeight:700,fontSize:14,color:C.pri,marginBottom:12}}>📊 Stok Material Saat Ini</div>{mats.map(m=>(<div key={m.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 8px",borderBottom:"1px solid #f5f5f5",borderRadius:6,background:f.mid===m.id?"#f0f4ff":"transparent"}}><div><div style={{fontWeight:600,fontSize:13}}>{m.nama}</div><div style={{fontSize:11,color:"#bbb"}}>{m.kode}</div></div><div style={{textAlign:"right"}}><span style={{fontWeight:700,fontSize:15,color:(stok[m.id]||0)<10?C.err:C.ok}}>{stok[m.id]||0}</span><span style={{fontSize:12,color:"#aaa",marginLeft:4}}>{m.satuan}</span></div></div>))}</Card>
  </div>);
}

// ─── RIWAYAT ─────────────────────────────────────────────
function Riwayat({trxs}){
  const [pg,setPg]=useState(1);const [filter,setFilter]=useState("all");const PS=15;
  const list=filter==="all"?trxs:trxs.filter(t=>t.type===filter);const paged=list.slice((pg-1)*PS,pg*PS);
  const fmtDt=iso=>new Date(iso).toLocaleString("id-ID",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
  return(<Card><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}><div style={{fontWeight:700,fontSize:14,color:C.pri}}>📜 Riwayat Transaksi</div><select value={filter} onChange={e=>{setFilter(e.target.value);setPg(1);}} style={{border:"1px solid #ddd",borderRadius:8,padding:"8px 12px",fontSize:13}}><option value="all">Semua</option><option value="inbound">Inbound</option><option value="outbound">Outbound</option></select></div>{paged.length===0?<div style={{textAlign:"center",padding:40,color:"#ccc"}}>Belum ada transaksi</div>:<><Tbl><TH cols={["Waktu","Tipe","Keterangan"]}/><tbody>{paged.map(t=>(<tr key={t.id}><TD style={{whiteSpace:"nowrap",fontSize:12}}>{fmtDt(t.tanggal)}</TD><TD><Badge label={t.type} color={t.type==="inbound"?C.ok:C.warn}/></TD><TD>{t.detail}</TD></tr>))}</tbody></Tbl><Pagination page={pg} total={Math.ceil(list.length/PS)} onChange={setPg}/></> }</Card>);
}

// ─── REKAP BULANAN ───────────────────────────────────────
function RekapBulanan({trxs,showNotif}){
  const now=new Date();const [month,setMonth]=useState(now.getMonth());const [year,setYear]=useState(now.getFullYear());const [saving,setSaving]=useState(false);
  const months=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  const filtered=useMemo(()=>trxs.filter(t=>{const d=new Date(t.tanggal);return d.getMonth()===month&&d.getFullYear()===year;}),[trxs,month,year]);
  const simpan=async()=>{setSaving(true);try{await apPost({action:"generateRekap",bulan:month,tahun:year});showNotif("Rekap disimpan ke Google Sheets!");}catch(e){showNotif("Gagal: "+e.message,"err");}setSaving(false);};
  return(<div>
    <Card style={{marginBottom:14}}><div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}><select value={month} onChange={e=>setMonth(parseInt(e.target.value))} style={{border:"1px solid #ddd",borderRadius:8,padding:"9px 12px",fontSize:13}}>{months.map((m,i)=><option key={i} value={i}>{m}</option>)}</select><select value={year} onChange={e=>setYear(parseInt(e.target.value))} style={{border:"1px solid #ddd",borderRadius:8,padding:"9px 12px",fontSize:13}}>{[2024,2025,2026,2027].map(y=><option key={y} value={y}>{y}</option>)}</select><span style={{fontWeight:700,fontSize:15,color:C.pri}}>Rekap {months[month]} {year}</span><Btn onClick={simpan} loading={saving} style={{marginLeft:"auto",padding:"8px 16px",fontSize:12}}>💾 Simpan Rekap</Btn></div></Card>
    <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:14,marginBottom:14}}><StatCard icon="📥" label="Inbound" value={filtered.filter(t=>t.type==="inbound").length+" trx"} color={C.ok}/><StatCard icon="📤" label="Outbound" value={filtered.filter(t=>t.type==="outbound").length+" trx"} color={C.warn}/><StatCard icon="📊" label="Total" value={filtered.length+" trx"} color={C.pri}/></div>
    <Card><div style={{fontWeight:700,fontSize:14,color:C.pri,marginBottom:12}}>Detail Transaksi</div>{filtered.length===0?<div style={{textAlign:"center",padding:40,color:"#ccc"}}>Tidak ada transaksi bulan ini</div>:<Tbl><TH cols={["Tipe","Keterangan","Tanggal"]}/><tbody>{filtered.map(t=>(<tr key={t.id}><TD><Badge label={t.type} color={t.type==="inbound"?C.ok:C.warn}/></TD><TD>{t.detail}</TD><TD style={{fontSize:12}}>{new Date(t.tanggal).toLocaleDateString("id-ID")}</TD></tr>))}</tbody></Tbl>}</Card>
  </div>);
}

// ─── ARSIP KAIN ──────────────────────────────────────────
function ArsipKain({kainList}){
  const [search,setSearch]=useState("");const [pg,setPg]=useState(1);const PS=10;
  const list=useMemo(()=>{let l=kainList.filter(k=>k.status==="arsip");if(search)l=l.filter(k=>k.kode.toLowerCase().includes(search.toLowerCase())||k.jenisNama.toLowerCase().includes(search.toLowerCase())||k.customer.toLowerCase().includes(search.toLowerCase()));return l;},[kainList,search]);
  const paged=list.slice((pg-1)*PS,pg*PS);
  return(<Card><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}><div style={{fontWeight:700,fontSize:14,color:C.pri}}>🗃️ Arsip Kain <span style={{fontSize:12,color:"#aaa",fontWeight:400}}>({list.length} item)</span></div><input placeholder="🔍 Cari..." value={search} onChange={e=>{setSearch(e.target.value);setPg(1);}} style={{border:"1px solid #ddd",borderRadius:8,padding:"9px 12px",fontSize:13,width:200}}/></div>{list.length===0?<div style={{textAlign:"center",padding:40,color:"#ccc"}}>Tidak ada kain di arsip</div>:<><Tbl><TH cols={["Kode Lengkap","Jenis Kain","Warna","Tipe","Total","Customer","Tgl Masuk"]}/><tbody>{paged.map(k=>(<tr key={k.id} style={{opacity:.7}}><TD><span style={{fontFamily:"monospace",fontSize:12,fontWeight:700}}>{k.kode}</span></TD><TD>{k.jenisNama}</TD><TD><Badge label={k.warna||"–"} color="#9e9e9e"/></TD><TD><Badge label={k.tipe} color="#bbb"/></TD><TD>{k.meter} m</TD><TD>{k.customer||"–"}</TD><TD style={{fontSize:12}}>{k.tanggal}</TD></tr>))}</tbody></Tbl><Pagination page={pg} total={Math.ceil(list.length/PS)} onChange={setPg}/></> }</Card>);
}

// ─── MENU CONFIG ─────────────────────────────────────────
const ALL_MENU=[
  {id:"dashboard",     icon:"🏠",label:"Dashboard"},
  {id:"nilai-stok",    icon:"💰",label:"Nilai Stok"},
  {id:"master-material",icon:"📦",label:"Master Material"},
  {id:"master-harga",  icon:"🏷️",label:"Master Harga"},
  {id:"stok-kain",     icon:"🧵",label:"Stok Kain"},
  {id:"buat-paket",    icon:"✏️",label:"Buat Paket"},
  {id:"daftar-paket",  icon:"📋",label:"Daftar Paket"},
  {id:"menu-order",    icon:"🔍",label:"Menu Order"},
  {id:"inbound",       icon:"📥",label:"Inbound / Outbound"},
  {id:"riwayat",       icon:"📜",label:"Riwayat"},
  {id:"rekap",         icon:"📊",label:"Rekap Bulanan"},
  {id:"arsip-kain",    icon:"🗃️",label:"Arsip Kain"},
];
const ADMIN_IDS=["dashboard","nilai-stok","stok-kain","buat-paket","daftar-paket","menu-order","inbound","riwayat"];

// ─── MAIN APP ────────────────────────────────────────────
function App(){
  const [role,setRole]=useState(null);
  const [page,setPage]=useState("dashboard");
  const [mats,setMats]=useState([]);const [harga,setHarga]=useState({});const [jenisKain,setJenisKain]=useState([]);const [stok,setStok]=useState({});const [kainList,setKainList]=useState([]);const [pkgs,setPkgs]=useState([]);const [trxs,setTrxs]=useState([]);
  const [sidebar,setSidebar]=useState(true);const [notif,setNotif]=useState(null);const [viewPaket,setViewPaket]=useState(null);const [loading,setLoading]=useState(false);const [loadError,setLoadError]=useState(null);

  const showNotif=useCallback((m,t="ok")=>{setNotif({m,t});setTimeout(()=>setNotif(null),3500);},[]);
  const addTrx=useCallback((type,detail)=>setTrxs(p=>[{id:genId(),type,detail,tanggal:new Date().toISOString()},...p]),[]);

  const loadAll=useCallback(async()=>{setLoading(true);setLoadError(null);try{const d=await apGet("getAll");const s=toState(d);setMats(s.mats);setHarga(s.harga);setStok(s.stok);setJenisKain(s.jenisKain);setKainList(s.kainList);setPkgs(s.pkgs);setTrxs(s.trxs);}catch(e){setLoadError(e.message);}setLoading(false);},[]);

  // ← Restore session saat refresh
  useEffect(()=>{
    const savedRole=sessionStorage.getItem("tarda_role");
    const savedApi=sessionStorage.getItem("tarda_api");
    if(savedRole&&savedApi){API=savedApi;setRole(savedRole);}
  },[]);

  useEffect(()=>{if(role)loadAll();},[role]);

  const doLogout=()=>{
    sessionStorage.removeItem("tarda_role");
    sessionStorage.removeItem("tarda_api");
    setRole(null);setMats([]);setHarga({});setStok({});setJenisKain([]);setKainList([]);setPkgs([]);setTrxs([]);
  };

  if(!role)return <LoginPage onLogin={r=>{setRole(r);setPage("dashboard");}}/>;
  if(loading)return <LoadingScreen/>;
  if(loadError)return <LoadingScreen error={loadError} onRetry={loadAll}/>;

  const menuItems=role==="owner"?ALL_MENU:ALL_MENU.filter(m=>ADMIN_IDS.includes(m.id));
  const cur=menuItems.find(m=>m.id===page)||menuItems[0];
  const p={mats,setMats,harga,setHarga,jenisKain,setJenisKain,stok,setStok,kainList,setKainList,pkgs,setPkgs,trxs,showNotif,addTrx,role,onViewPaket:setViewPaket};

  const renderPage=()=>{switch(page){
    case "dashboard":     return <Dashboard {...p}/>;
    case "nilai-stok":    return <NilaiStok mats={mats} stok={stok} harga={harga} kainList={kainList} jenisKain={jenisKain}/>;
    case "master-material":return <MasterMaterial {...p}/>;
    case "master-harga":  return <MasterHarga {...p}/>;
    case "stok-kain":     return <StokKain {...p}/>;
    case "buat-paket":    return <BuatPaket {...p}/>;
    case "daftar-paket":  return <DaftarPaket pkgs={pkgs} setPkgs={setPkgs} onViewPaket={setViewPaket} showNotif={showNotif} role={role}/>;
    case "menu-order":    return <MenuOrder {...p}/>;
    case "inbound":       return <InboundOutbound {...p}/>;
    case "riwayat":       return <Riwayat trxs={trxs}/>;
    case "rekap":         return <RekapBulanan trxs={trxs} showNotif={showNotif}/>;
    case "arsip-kain":    return <ArsipKain kainList={kainList}/>;
    default: return null;
  }};

  return(<div style={{display:"flex",height:"100vh",fontFamily:"'Segoe UI',system-ui,sans-serif",background:C.bg,overflow:"hidden"}}>
    <div style={{width:sidebar?232:60,transition:"width .25s ease",background:`linear-gradient(180deg,${C.pri} 0%,${C.sec} 100%)`,display:"flex",flexDirection:"column",flexShrink:0,boxShadow:"2px 0 12px rgba(0,0,0,.15)",zIndex:10,overflow:"hidden"}}>
      <div style={{padding:"14px 12px",display:"flex",alignItems:"center",borderBottom:"1px solid rgba(255,255,255,.1)",minHeight:58,gap:8}}>
        {sidebar&&<div style={{overflow:"hidden",flex:1}}><div style={{fontWeight:700,fontSize:14,color:"#fff",whiteSpace:"nowrap"}}>Tarda Tailor</div><div style={{fontSize:11,color:"rgba(255,255,255,.55)",whiteSpace:"nowrap"}}>Inventory System</div></div>}
        <button onClick={()=>setSidebar(!sidebar)} style={{background:"none",border:"none",color:"#fff",cursor:"pointer",fontSize:20,padding:4,flexShrink:0,marginLeft:sidebar?"0":"auto"}}>☰</button>
      </div>
      <div style={{flex:1,overflowY:"auto",overflowX:"hidden"}}>{menuItems.map(m=>(<button key={m.id} onClick={()=>setPage(m.id)} title={m.label} style={{display:"flex",alignItems:"center",gap:12,padding:"11px 16px",width:"100%",background:page===m.id?"rgba(255,255,255,.15)":"transparent",border:"none",borderLeft:`3px solid ${page===m.id?"#64b5f6":"transparent"}`,color:"#fff",cursor:"pointer",textAlign:"left",fontSize:13,whiteSpace:"nowrap",transition:"background .15s"}}><span style={{fontSize:17,flexShrink:0}}>{m.icon}</span>{sidebar&&<span style={{overflow:"hidden",textOverflow:"ellipsis"}}>{m.label}</span>}</button>))}</div>
      {sidebar&&<div style={{padding:"12px 16px",borderTop:"1px solid rgba(255,255,255,.1)"}}><div style={{fontSize:11,color:"rgba(255,255,255,.5)",marginBottom:6}}>{role==="owner"?"👑 Owner":"🏪 Admin Gudang"}</div><button onClick={doLogout} style={{fontSize:12,color:"rgba(255,255,255,.6)",background:"none",border:"1px solid rgba(255,255,255,.2)",borderRadius:6,padding:"5px 10px",cursor:"pointer",width:"100%"}}>🚪 Logout</button></div>}
    </div>
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",minWidth:0}}>
      <div style={{background:"#fff",padding:"0 24px",height:56,display:"flex",alignItems:"center",justifyContent:"space-between",boxShadow:"0 1px 4px rgba(0,0,0,.08)",flexShrink:0}}>
        <div style={{fontWeight:700,fontSize:17,color:C.pri}}>{cur?.icon} {cur?.label}</div>
        <div style={{display:"flex",alignItems:"center",gap:12}}><Badge label={role==="owner"?"👑 Owner":"🏪 Admin Gudang"} color={role==="owner"?C.warn:C.acc}/><div style={{fontSize:12,color:"#aaa"}}>{new Date().toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"})}</div></div>
      </div>
      <div style={{flex:1,overflow:"auto",padding:20}}>{renderPage()}</div>
    </div>
    <Notif n={notif}/>
    {viewPaket&&<PaketDetailModal pkg={viewPaket} onClose={()=>setViewPaket(null)}/>}
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
